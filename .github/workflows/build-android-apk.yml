name: android-apk

on:
  push:
    branches: [ android-port ]
    paths: [ 'android-port/**', 'engine/**', '.github/workflows/build-android-apk.yml' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile-check the UI (fast, before the engine build)
        run: |
          curl -sS -o /tmp/pf.zip https://dl.google.com/android/repository/platform-33-ext4_r01.zip
          unzip -qo /tmp/pf.zip -d /tmp/pf
          AJ=$(find /tmp/pf -name android.jar | head -1)
          mkdir -p /tmp/ui-classes
          javac -source 1.8 -target 1.8 -encoding UTF-8 -Xlint:-options \
            -bootclasspath "$AJ" -classpath "$AJ" \
            $(find android-port/apk/java -name '*.java') -d /tmp/ui-classes
          echo "UI compiles clean"

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools zip

      - name: Fetch NDK r28b
        run: |
          curl -sS -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK=$RUNNER_TEMP/ndk/android-ndk-r28b" >> "$GITHUB_ENV"

      - name: Fetch pinned deps (LibRaw 0.22.2 + Vulkan-Headers)
        working-directory: engine
        run: ./setup-deps.sh

      - name: Apply android port patch (Adreno unfused-fma acceptance)
        run: |
          git apply android-port/vulkan-gpu-unfused-fma.patch
          git apply android-port/cmake-min-version.patch

      - name: Cache engine build
        uses: actions/cache@v4
        with:
          path: |
            build/android-ci/build
            engine/third_party
          key: spk-engine-${{ hashFiles('engine/**', 'android-port/build-host.sh', 'android-port/android-toolchain-ndk.cmake', 'android-port/*.patch') }}

      - name: Build engine + host for Android aarch64
        run: bash android-port/build-host.sh
        env:
          SPEKTRALAB_HOST_VERSION: 0.1.0+android-${{ github.sha }}

      - name: Stage APK inputs
        run: |
          mkdir -p android-port/apk/assets android-port/apk/lib/arm64-v8a
          cp -R build/android-ci/stage/engine android-port/apk/assets/engine
          cp build/android-ci/stage/spektralab-host android-port/apk/lib/arm64-v8a/libspektralab_host.so

      - name: Assemble APK
        run: bash android-port/build-apk.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spektralab-mobile-${{ github.sha }}
          path: android-port/apk/spektralab-mobile.apk
